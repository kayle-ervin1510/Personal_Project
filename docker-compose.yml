services:
    db:
        image: postgres:15
        container_name: personal_proj-container
        env_file:
            - ./personal_proj_back/.env
        ports:
            - "5431:5432"
    
    backend:
        build: ./personal_proj_back
        container_name: django-container
        command: sh -c "gunicorn personal_proj_back.wsgi --bind 0.0.0.0:8000 --reload"
        env_file:
            - ./personal_proj_back/.env
        ports:
            - "8000:8000"
        volumes:
            - ./personal_proj_back:/app
        depends_on:
            - db
    
    nginx:
        build: ./personal_proj_front
        container_name: nginx-container
        ports:
            - "80:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencryp:/etc/letsencrypt:ro
            #- ./personal_proj_front/dist:/usr/share/nginx/html
        depends_on:
            - backend
    
volumes:
    pgdata: