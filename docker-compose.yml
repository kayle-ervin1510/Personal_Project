services:
    db:
        image: postgres:15
        container_name: personal_proj-container
        env_file:
            - ./personal_proj_back/.env
        ports:
            - "5431:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        # for instance:
        # restart: unless-stopped
    
    backend:
        build: ./personal_proj_back
        container_name: django-container
        command: sh -c "gunicorn personal_proj_back.wsgi --bind 0.0.0.0:8000 --reload"
        # instance:
        #command: gunicorn personal_proj_back.wsgi --bind 0.0.0.0:8000
        env_file:
            - ./personal_proj_back/.env
        ports:
            - "8000:8000"
        volumes:
            - ./personal_proj_back:/app
        depends_on:
            - db
        # instance
        # restart: unless-stopped
    
    nginx:
        build: ./personal_proj_front
        container_name: nginx-container
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt:ro
            #- ./personal_proj_front/dist:/usr/share/nginx/html
        depends_on:
            - backend
        # instance:
        # restart: unless-stopped
    
volumes:
    pgdata: