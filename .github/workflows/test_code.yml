# GitHub Action Workflow based off Cypress Documentation
name: Cypress Tests

on:
  
  pull_request:
    branches:
        - main
# add service that install postgres
  push:
    branches:
        - main
  workflow_dispatch:

jobs:

  container-job:
    runs-on: ubunut-latest
    container: django-container
  
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD:
        
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        
    steps:
      - name: Check out repository code
        run: node client.js
        env:
          # POSTGRES_HOST: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432



  cypress-run:
    runs-on: ubuntu-latest

    # container:
    #   image: cypress/browsers:22.15.0
    #   options: --user 1001
    steps:
      # - name: Checkout repository
      # uses: actions/checkout@v7
      - name: Checkout
        uses: actions/checkout@v4
      
      # step Python
      # install backend dpendencies
      # run migrations
      # start django
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - name: Run Migrations
        run: |
            python manage.py migrate

          

          
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
            node-version: 24
            cache: npm
            cache-dependency-path: personal_proj_front/package-lock.json


      - name: Install Dependencies
        run: npm ci
        working-directory: personal_proj_front

      - name: execute cypress
        uses: cypress-io/github-action@v7
        with:
            working-directory: personal_proj_front
            browser: electron
           # browser: chrome 
            start: npm run dev
            wait-on: http://localhost:5173/

      # add in backend tests
   