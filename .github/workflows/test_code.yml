# GitHub Action Workflow based off Cypress Documentation
name: Cypress Tests

on:
  
  pull_request:
    branches:
        - main

  push:
    branches:
        - main
  workflow_dispatch:

jobs:


  cypress-run:
    runs-on: ubuntu-latest
    
    # container: django-containner

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: personal_proj_db
          POSTGRES_USER: pp_user
          POSTGRES_PASSWORD: pencilLIP
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        
        

    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: npm ci
        working-directory: personal_proj_back
      
      # - name: Test with my tests
      #   run: |
      #     cd personal_proj_back/tests
      #     source run_all_tests.sh 
        # maybe make a run_all_tets.sh file to run my tests

    
       
      
      - name: Checkout
        uses: actions/checkout@v4
      
      # step Python
      # install backend dpendencies
      # run migrations
      # start django
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        working-directory: personal_proj_back

      - name: Run Migrations
        run: |
          python manage.py migrate
        working-directory: personal_proj_back
      
      - name: Start Django server
        run: |
          python manage.py runserver 8000 --noreload &
          
        env:
          DB_HOST: localhost
          DB_PORT: 5432

          
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
            node-version: 24
            cache: npm
            cache-dependency-path: personal_proj_front/package-lock.json


      - name: Install Dependencies
        run: npm ci
        working-directory: personal_proj_front

      - name: execute cypress
        uses: cypress-io/github-action@v7
        with:
            working-directory: personal_proj_front
            browser: electron
           # browser: chrome 
            start: npm run dev
            wait-on: http://localhost:5173/

   